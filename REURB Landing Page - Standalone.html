    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

    console.error('Bundle unpack error:', err);

89c3d-13dc-4bc3-b305-25d1307df1d0\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"540ad7d0-325d-479f-b862-662f75e12082\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"6afb514a-13c4-43a7-a724-54a8d1ebde2c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"9b9bd161-d1cb-4e06-88f9-4f041c3917aa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; background:#f7f9fc; scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }\n  * { box-sizing:border-box; }\n  input:focus, select:focus, button:focus { outline: 2px solid #2f7fe8; outline-offset:1px; }\n  ::selection { background:#2f7fe8; color:#fff; }\n  @keyframes pulseRing { 0% { box-shadow:0 0 0 0 rgba(255,255,255,.35); } 100% { box-shadow:0 0 0 16px rgba(255,255,255,0); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"reurb-lp\" style=\"font-family:'Inter',sans-serif;color:#10192b;background:#f7f9fc;width:100%;overflow-x:hidden;line-height:1.55;\">\n\n<!-- HERO -->\n<section data-reveal=\"\" style=\"padding:56px 20px 44px;max-width:900px;margin:0 auto;text-align:center;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#2f7fe8;margin:0 0 18px;\">Para advogados e advogadas<\u002Fp>\n  <h1 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(28px,6vw,44px);line-height:1.18;margin:0 0 20px;color:#0a1a2f;\">As coisas mudaram. Existe um novo mercado de R$1,5 trilhão dentro da regularização fundiária, parado, esperando escritório pra atuar nele.<\u002Fh1>\n  <p style=\"font-size:17px;color:#4b5563;max-width:620px;margin:0 auto 32px;\">15 aulas curtas, direto ao ponto, que mostram o tamanho desse mercado, por que ele ainda está parado, e por onde você começa a atuar nele essa semana.<\u002Fp>\n\n  <!-- SUBSTITUIR por <iframe> do YouTube/Vimeo. Manter formato retrato (reels), max-width ~380px centralizado -->\n  <div id=\"vsl-video\" style=\"aspect-ratio:9/16;width:100%;max-width:380px;margin:0 auto;background:#0a1a2f;border-radius:20px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 16px 36px rgba(10,26,47,.28);\">\n    <div style=\"width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;animation:pulseRing 2.2s ease-out infinite;\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M8 5v14l11-7L8 5z\" fill=\"#ffffff\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"position:absolute;bottom:20px;font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.06em;color:rgba(255,255,255,.7);text-transform:uppercase;\">[Vídeo pendente]<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:32px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n    <a href=\"#oferta\" style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;background:#2f7fe8;color:#fff;padding:16px 30px;border-radius:10px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(47,127,232,.3);transition:transform .2s ease,box-shadow .2s ease;\" style-hover=\"transform:translateY(-2px);box-shadow:0 10px 24px rgba(47,127,232,.4);\">Quero Garantir Minha Vaga<\u002Fa>\n    <p style=\"font-size:13px;color:#6b7280;margin:0;\">Acesso imediato na plataforma · Garantia de 7 dias<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:720px;margin:0 auto;height:1px;background:#e2e6ee;\"><\u002Fdiv>\n\n<!-- O QUE MUDOU -->\n<section data-reveal=\"\" style=\"padding:56px 20px;max-width:760px;margin:0 auto;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#2f7fe8;text-align:center;margin:0 0 14px;\">Por que isso importa agora<\u002Fp>\n  <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,4.5vw,32px);color:#0a1a2f;text-align:center;margin:0 0 24px;\">O que mudou<\u002Fh2>\n  <p style=\"font-size:17px;color:#374151;margin:0 0 16px;\">Esse mercado não é novo porque acabou de nascer. É novo porque o cenário ao redor dele mudou — e quem não perceber isso vai continuar tratando REURB como algo secundário, enquanto outros já estão estruturando operação em cima dele.<\u002Fp>\n  <p style=\"font-size:17px;color:#374151;margin:0 0 32px;\">Três coisas mudaram ao mesmo tempo, e é por isso que agora é diferente de cinco anos atrás:<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:36px;\">\n    <div style=\"background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:22px;transition:transform .25s ease,box-shadow .25s ease;\" style-hover=\"transform:translateY(-4px);box-shadow:0 12px 24px rgba(10,26,47,.1);\">\n      <div style=\"width:40px;height:40px;border-radius:9px;background:#eef3fb;display:flex;align-items:center;justify-content:center;margin-bottom:14px;\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M3 10 12 4l9 6M5 10v9M19 10v9M9 19v-6h6v6M3 19h18\" stroke=\"#2f7fe8\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 6px;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#0a1a2f;\">O cartório mudou.<\u002Fp>\n      <p style=\"margin:0;font-size:15px;color:#4b5563;\">A transição pro RI Digital está tornando o processo de regularização mais rápido e mais previsível do que nunca foi — isso reduz o principal motivo pelo qual escritórios evitavam REURB: a demora.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:22px;transition:transform .25s ease,box-shadow .25s ease;\" style-hover=\"transform:translateY(-4px);box-shadow:0 12px 24px rgba(10,26,47,.1);\">\n      <div style=\"width:40px;height:40px;border-radius:9px;background:#eef3fb;display:flex;align-items:center;justify-content:center;margin-bottom:14px;\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M3 17 9 11l4 4 8-8M21 7h-5v5\" stroke=\"#2f7fe8\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 6px;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#0a1a2f;\">A concorrência mudou.<\u002Fp>\n      <p style=\"margin:0;font-size:15px;color:#4b5563;\">Plataformas de varejo já regularizaram mais de 50 mil imóveis sem depender de advogado autônomo. Isso não é ameaça distante — é prova de que dá pra operar esse mercado em volume, hoje.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:22px;transition:transform .25s ease,box-shadow .25s ease;\" style-hover=\"transform:translateY(-4px);box-shadow:0 12px 24px rgba(10,26,47,.1);\">\n      <div style=\"width:40px;height:40px;border-radius:9px;background:#eef3fb;display:flex;align-items:center;justify-content:center;margin-bottom:14px;\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2v20M17 6.5c0-1.9-2.2-3.5-5-3.5s-5 1.6-5 3.5 2.2 3.2 5 3.5c2.8.3 5 1.6 5 3.5s-2.2 3.5-5 3.5-5-1.6-5-3.5\" stroke=\"#2f7fe8\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 6px;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#0a1a2f;\">O dinheiro não mudou de lugar — só não foi capturado ainda.<\u002Fp>\n      <p style=\"margin:0;font-size:15px;color:#4b5563;\">R$1,5 trilhão continua parado, esperando estrutura. Não é dinheiro que vai aparecer no futuro. É dinheiro que já existe, agora, na sua região.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"text-align:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:19px;color:#0a1a2f;font-style:italic;margin:0;\">\"Quem entender isso primeiro não está apostando em uma tendência. Está chegando antes num mercado que já está em movimento.\"<\u002Fp>\n<\u002Fsection>\n\n<!-- TRANSFORMAÇÃO -->\n<section data-reveal=\"\" style=\"padding:56px 20px;max-width:720px;margin:0 auto;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#2f7fe8;text-align:center;margin:0 0 14px;\">Transformação<\u002Fp>\n  <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,4.5vw,32px);color:#0a1a2f;text-align:center;margin:0 0 32px;\">Antes e depois desse guia<\u002Fh2>\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:28px;\">\n    <sc-for list=\"{{ transformacao }}\" as=\"item\" hint-placeholder-count=\"3\">\n      <div style=\"background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:20px;transition:transform .25s ease,box-shadow .25s ease;\" style-hover=\"transform:translateY(-3px);box-shadow:0 10px 22px rgba(10,26,47,.08);\">\n        <div style=\"display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;\">\n          <span style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9aa1ab;flex-shrink:0;width:56px;\">Antes<\u002Fspan>\n          <p style=\"margin:0;font-size:15px;color:#6b7280;\">{{ item.antes }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;\">\n          <span style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#2f7fe8;flex-shrink:0;width:56px;\">Depois<\u002Fspan>\n          <p style=\"margin:0;font-size:15px;color:#0a1a2f;font-weight:500;\">{{ item.depois }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <p style=\"text-align:center;font-size:16px;color:#374151;margin:0;\">Esse guia não é sobre aprender mais direito — você já sabe. É sobre enxergar um mercado que está bem na sua frente, entender por que ele trava, e sair sabendo exatamente por onde começar.<\u002Fp>\n<\u002Fsection>\n\n<!-- PRINTS DE RESULTADOS -->\n<section data-reveal=\"\" style=\"padding:56px 20px;background:#0a1a2f;color:#fff;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <div style=\"max-width:720px;margin:0 auto;\">\n    <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7db2f5;text-align:center;margin:0 0 14px;\">Prints de resultados<\u002Fp>\n    <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,4.5vw,32px);color:#fff;text-align:center;margin:0 0 24px;\">O que uma única regularização já vale<\u002Fh2>\n    <p style=\"font-size:16px;color:rgba(255,255,255,.8);margin:0 0 8px;\">Antes dos prints, a conta que sustenta essa seção:<\u002Fp>\n    <p style=\"font-size:17px;color:#fff;margin:0 0 32px;\">Uma única regularização, no piso da tabela de honorários (10% sobre o valor venal de um imóvel de R$80 a R$120 mil, faixa comum em núcleos urbanos informais), já representa entre <strong style=\"color:#7db2f5;\">R$8.000 e R$12.000<\u002Fstrong> de honorário — com um cliente só, um processo só.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px;\">\n      <sc-for list=\"{{ prints }}\" as=\"item\" hint-placeholder-count=\"3\">\n        <div style=\"background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.3);border-radius:10px;height:120px;display:flex;align-items:center;justify-content:center;\">\n          <span style=\"font-size:12.5px;color:rgba(255,255,255,.55);letter-spacing:.04em;text-align:center;padding:0 12px;\">[PRINT PENDENTE — Pix / extrato de honorário / mensagem de cliente]<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"font-size:15px;color:rgba(255,255,255,.7);margin:0;\">Isso não é o teto do mercado — é o piso. Em processos de interesse específico (REURB-E), o valor sobe proporcionalmente ao valor do imóvel, chegando a honorário de 20%.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- QUEM SOMOS -->\n<section data-reveal=\"\" style=\"padding:56px 20px;max-width:720px;margin:0 auto;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#2f7fe8;text-align:center;margin:0 0 14px;\">Quem somos<\u002Fp>\n  <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,4.5vw,32px);color:#0a1a2f;text-align:center;margin:0 0 28px;\">Por que estamos falando sobre isso<\u002Fh2>\n\n  <div style=\"display:flex;justify-content:center;margin-bottom:28px;\">\n    <img src=\"f9f67024-154a-448f-910c-298f334019a9\" alt=\"CERURB — Central de Regularização Fundiária\" style=\"max-width:280px;width:100%;height:auto;\">\n  <\u002Fdiv>\n\n  <p style=\"font-size:17px;color:#374151;margin:0 0 16px;\">O CERURB não nasceu dentro de um escritório de advocacia. Nasceu dentro de um cartório.<\u002Fp>\n  <p style=\"font-size:17px;color:#374151;margin:0 0 16px;\">Foi ali, do lado de dentro do balcão de registro — vendo processo depois de processo voltar com exigência, vendo honorário travar por um motivo que não era jurídico — que ficou claro qual é o verdadeiro ponto cego do mercado de regularização fundiária: <strong style=\"color:#0a1a2f;\">o problema nunca foi o advogado não saber a lei. É a distância entre o que ele sabe e o sistema que deveria sustentar esse conhecimento.<\u002Fstrong><\u002Fp>\n  <p style=\"font-size:17px;color:#374151;margin:0 0 28px;\">O CERURB existe com uma missão só: <strong style=\"color:#0a1a2f;\">potencializar o advogado.<\u002Fstrong> Não substituir. Não tirar o advogado da equação, como fazem as plataformas de varejo. Dar a ele a estrutura que faltava — para o mesmo profissional que já domina o direito conseguir captar, atender e escalar esse mercado.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;\">\n    <div style=\"background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:20px;transition:transform .25s ease,box-shadow .25s ease;\" style-hover=\"transform:translateY(-4px);box-shadow:0 12px 24px rgba(10,26,47,.1);\">\n      <div style=\"width:36px;height:36px;border-radius:8px;background:#eef3fb;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z\" stroke=\"#2f7fe8\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z\" stroke=\"#2f7fe8\" stroke-width=\"1.3\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 4px;font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;color:#0a1a2f;\">CERURB TECH<\u002Fp>\n      <p style=\"margin:0;font-size:14px;color:#5b6672;\">A operação — RP, CRM, captação.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:20px;transition:transform .25s ease,box-shadow .25s ease;\" style-hover=\"transform:translateY(-4px);box-shadow:0 12px 24px rgba(10,26,47,.1);\">\n      <div style=\"width:36px;height:36px;border-radius:8px;background:#eef3fb;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 19.5V6a2 2 0 0 1 2-2h13v15.5\" stroke=\"#2f7fe8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M6 22a2 2 0 0 1-2-2v0a2 2 0 0 1 2-2h13v4H6Z\" stroke=\"#2f7fe8\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 4px;font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;color:#0a1a2f;\">CERURB ACADEMY<\u002Fp>\n      <p style=\"margin:0;font-size:14px;color:#5b6672;\">O conhecimento comercial que a faculdade não ensina.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:20px;transition:transform .25s ease,box-shadow .25s ease;\" style-hover=\"transform:translateY(-4px);box-shadow:0 12px 24px rgba(10,26,47,.1);\">\n      <div style=\"width:36px;height:36px;border-radius:8px;background:#eef3fb;display:flex;align-items:center;justify-content:center;margin-bottom:12px;\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3v18M5 7l-3 6a3.5 3.5 0 0 0 7 0l-3-6ZM19 7l-3 6a3.5 3.5 0 0 0 7 0l-3-6ZM5 7h14M9 21h6\" stroke=\"#2f7fe8\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 4px;font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;color:#0a1a2f;\">CERURB JUS<\u002Fp>\n      <p style=\"margin:0;font-size:14px;color:#5b6672;\">A única solução do mercado com parceria direta com o Tribunal de Justiça.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <!-- nota de produção: incluir aqui, quando confirmado, o reconhecimento da ABES (Associação Brasileira das Empresas de Software) -->\n<\u002Fsection>\n\n<!-- OFERTA -->\n<section id=\"oferta\" data-reveal=\"\" style=\"padding:56px 20px;background:#eef3fb;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <div style=\"max-width:720px;margin:0 auto;\">\n    <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#2f7fe8;text-align:center;margin:0 0 14px;\">O que você recebe<\u002Fp>\n    <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,4.5vw,32px);color:#0a1a2f;text-align:center;margin:0 0 8px;\">O Novo Mercado da REURB<\u002Fh2>\n    <p style=\"text-align:center;color:#5b6672;font-size:16px;margin:0 0 32px;\">3 módulos, 15 aulas curtas, direto ao ponto.<\u002Fp>\n\n    <div style=\"background:#fff;border:1px solid #dde3ee;border-radius:16px;padding:clamp(20px,4vw,36px);box-shadow:0 8px 28px rgba(10,26,47,.08);\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:24px;\">\n        <sc-for list=\"{{ modulos }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid #e2e6ee;border-radius:10px;padding:16px 18px;display:flex;align-items:center;gap:12px;transition:transform .2s ease,border-color .2s ease;\" style-hover=\"transform:translateX(4px);border-color:#2f7fe8;\">\n            <div style=\"width:32px;height:32px;border-radius:8px;background:#eef3fb;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M8 5v14l11-7L8 5z\" fill=\"#2f7fe8\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <p style=\"margin:0 0 2px;font-family:'Manrope',sans-serif;font-weight:700;font-size:15.5px;color:#0a1a2f;\">{{ item.titulo }}<\u002Fp>\n              <p style=\"margin:0 0 6px;font-size:14px;color:#6b7280;\">{{ item.aulas }} aulas<\u002Fp>\n              <p style=\"margin:0;font-size:14px;color:#4b5563;\">{{ item.resumo }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border:1.5px solid #2f7fe8;background:#f2f7ff;border-radius:12px;padding:20px;margin-bottom:26px;\">\n        <span style=\"display:inline-block;font-family:'Manrope',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:#2f7fe8;padding:5px 10px;border-radius:6px;margin-bottom:12px;\">Bônus exclusivo<\u002Fspan>\n        <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#0a1a2f;margin:0 0 4px;\">Biblioteca de 23 templates prontos para uso<\u002Fp>\n        <p style=\"font-size:14px;color:#4b5563;margin:0 0 16px;\">Modelos reais de documentação de REURB, organizados por fase, prontos pra copiar e adaptar no seu próximo processo.<\u002Fp>\n\n        <div style=\"background:#fff;border:1px solid #dbe4f3;border-radius:10px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;\">\n          <div style=\"text-align:center;\">\n            <p style=\"margin:0;font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:#0a1a2f;\">23<\u002Fp>\n            <p style=\"margin:2px 0 0;font-size:12.5px;color:#5b6672;\">arquivos prontos<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <p style=\"margin:0;font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:#0a1a2f;\">4<\u002Fp>\n            <p style=\"margin:2px 0 0;font-size:12.5px;color:#5b6672;\">fases do processo<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <p style=\"margin:0;font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:#0a1a2f;\">100%<\u002Fp>\n            <p style=\"margin:2px 0 0;font-size:12.5px;color:#5b6672;\">editáveis<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 16px;\">\n          <sc-for list=\"{{ templates }}\" as=\"item\" hint-placeholder-count=\"23\">\n            <div style=\"display:flex;gap:8px;align-items:flex-start;padding:3px 0;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0;margin-top:3px;\"><path d=\"M20 6 9 17l-5-5\" stroke=\"#2f7fe8\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:13.5px;color:#374151;\">{{ item.nome }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"font-size:14.5px;color:#4b5563;margin:0 0 26px;text-align:center;\">✓ Acesso imediato após a confirmação da compra, direto na plataforma<\u002Fp>\n\n      <!-- ancora: valor riscado maior — preço sobe conforme a plataforma cresce -->\n      <div style=\"text-align:center;margin-bottom:22px;\">\n        <p style=\"font-size:15px;color:#9aa1ab;text-decoration:line-through;margin:0 0 10px;\">De {{ anchorPrice }}<\u002Fp>\n        <p style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin:0 0 4px;\">Parcelas<\u002Fp>\n        <p style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(34px,6.5vw,48px);color:#0a1a2f;margin:0;\">{{ installments }}x de {{ installmentPrice }}<\u002Fp>\n        <p style=\"font-size:13.5px;color:#6b7280;margin:8px 0 0;\">ou {{ price }} à vista<\u002Fp>\n        <p style=\"font-size:12.5px;color:#2f7fe8;font-weight:600;margin:10px 0 0;\">O valor de acesso sobe conforme mais aulas e templates são adicionados à plataforma.<\u002Fp>\n      <\u002Fdiv>\n\n      <button type=\"button\" sc-camel-on-click=\"{{ openModal }}\" style=\"width:100%;min-height:56px;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;background:#2f7fe8;color:#fff;border:none;border-radius:10px;cursor:pointer;box-shadow:0 6px 18px rgba(47,127,232,.3);transition:transform .2s ease,box-shadow .2s ease;\" style-hover=\"transform:translateY(-2px);box-shadow:0 10px 26px rgba(47,127,232,.4);\">Quero Garantir Minha Vaga<\u002Fbutton>\n    <\u002Fdiv>\n\n    <p style=\"text-align:center;font-size:13px;color:#8b93a0;margin-top:18px;\">No checkout você também pode adicionar Acesso Vitalício (+R$97) e REURB Summit (+R$47) como upgrades opcionais.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- GARANTIA -->\n<section data-reveal=\"\" style=\"padding:56px 20px;background:#eef3fb;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <div style=\"max-width:600px;margin:0 auto;text-align:center;\">\n    <img src=\"42fea460-1b33-454d-997c-2a30d0d39bd3\" alt=\"Selo de garantia de 7 dias\" style=\"width:120px;height:auto;margin:0 auto 20px;display:block;\">\n    <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(22px,4vw,28px);color:#0a1a2f;margin:0 0 12px;\">Garantia de {{ guaranteeDays }} dias, sem perguntas<\u002Fh2>\n    <p style=\"font-size:16px;color:#4b5563;margin:0;\">Se você entrar, assistir e sentir que não é pra você, é só pedir o reembolso dentro de {{ guaranteeDays }} dias. Sem burocracia, sem justificativa.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section data-reveal=\"\" style=\"padding:56px 20px;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <div style=\"max-width:680px;margin:0 auto;\">\n    <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,4.5vw,32px);color:#0a1a2f;text-align:center;margin:0 0 28px;\">Perguntas frequentes<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #e2e6ee;border-radius:12px;overflow:hidden;background:#fff;transition:border-color .2s ease;\" style-hover=\"border-color:#2f7fe8;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ item.toggle }}\" style=\"width:100%;text-align:left;background:none;border:none;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;min-height:44px;\">\n            <span style=\"font-weight:600;font-size:15.5px;color:#0a1a2f;\">{{ item.q }}<\u002Fspan>\n            <span style=\"font-size:20px;color:#2f7fe8;flex-shrink:0;\">{{ item.symbol }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ item.isOpen }}\">\n            <p style=\"margin:0;padding:0 20px 18px;font-size:15px;color:#4b5563;\">{{ item.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA FINAL -->\n<section data-reveal=\"\" style=\"padding:56px 20px;background:#0a1a2f;color:#fff;text-align:center;opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);\">\n  <div style=\"max-width:640px;margin:0 auto;\">\n    <div style=\"width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2 2 7l10 5 10-5-10-5ZM2 17l10 5 10-5M2 12l10 5 10-5\" stroke=\"#7db2f5\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,4.5vw,32px);margin:0 0 16px;color:#fff;\">O novo mercado está aberto<\u002Fh2>\n    <p style=\"font-size:16px;color:rgba(255,255,255,.75);margin:0 0 28px;\">A REURB já está destravada nos cartórios. A única variável em aberto é quem, entre os advogados da sua região, vai se posicionar primeiro para atender essa demanda.<\u002Fp>\n    <a href=\"#oferta\" style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;background:#2f7fe8;color:#fff;padding:16px 30px;border-radius:10px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(47,127,232,.35);transition:transform .2s ease,box-shadow .2s ease;\" style-hover=\"transform:translateY(-2px);box-shadow:0 10px 26px rgba(47,127,232,.45);\">Quero Garantir Minha Vaga<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PS -->\n<section style=\"padding:44px 20px;max-width:640px;margin:0 auto;text-align:center;\">\n  <p style=\"font-size:15px;color:#4b5563;margin:0;\"><strong style=\"color:#0a1a2f;\">PS:<\u002Fstrong> por {{ installments }}x de {{ installmentPrice }} (ou {{ price }} à vista), você acessa os 3 módulos, as 15 aulas e a biblioteca completa de 23 templates, com garantia de {{ guaranteeDays }} dias e liberação imediata assim que a inscrição é confirmada.<\u002Fp>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"padding:32px 20px;border-top:1px solid #e2e6ee;text-align:center;\">\n  <p style=\"font-size:13px;color:#9aa1ab;margin:0 0 6px;\">CERURB TECH © 2026 · CNPJ [PENDENTE]<\u002Fp>\n  <p style=\"font-size:13px;color:#9aa1ab;margin:0;\">[Termos de Uso] · [Política de Privacidade] · Este material não constitui aconselhamento jurídico individualizado.<\u002Fp>\n<\u002Ffooter>\n\n<!-- MODAL -->\n<sc-if value=\"{{ modalOpen }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(10,26,47,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;\">\n    <div sc-camel-on-click=\"{{ stopClick }}\" style=\"background:#f7f9fc;border-radius:16px;padding:28px 24px;width:min(92vw,440px);max-height:92vh;overflow:auto;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.3);\">\n      <button type=\"button\" sc-camel-on-click=\"{{ closeModal }}\" aria-label=\"Fechar\" style=\"position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:#e9edf5;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M6 6l12 12M18 6 6 18\" stroke=\"#374151\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:16px;\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4Z\" stroke=\"#2f7fe8\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:#2f7fe8;\">Garantir minha vaga<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:24px 0;\">\n          <h3 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;color:#0a1a2f;margin:0 0 10px;\">Recebemos seus dados.<\u002Fh3>\n          <p style=\"font-size:15px;color:#4b5563;margin:0;\">Seu acesso será liberado em instantes. Fique de olho no seu WhatsApp e e-mail.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <h3 style=\"font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;color:#0a1a2f;margin:0 0 10px;\">Falta pouco pra você começar.<\u002Fh3>\n          <p style=\"font-size:15px;color:#5b6672;margin:0 0 22px;\">Preencha seus dados e você recebe o acesso liberado na hora.<\u002Fp>\n\n          <form sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"display:flex;flex-direction:column;gap:12px;\">\n            <input type=\"text\" required=\"{{ true }}\" placeholder=\"Seu nome completo\" style=\"width:100%;min-height:48px;padding:0 14px;border:1px solid #d5dbe6;border-radius:9px;font-size:16px;font-family:'Inter',sans-serif;background:#fff;\">\n            <input type=\"email\" required=\"{{ true }}\" placeholder=\"Seu melhor e-mail\" style=\"width:100%;min-height:48px;padding:0 14px;border:1px solid #d5dbe6;border-radius:9px;font-size:16px;font-family:'Inter',sans-serif;background:#fff;\">\n            <div style=\"display:flex;gap:8px;\">\n              <sc-raw-select style=\"min-height:48px;padding:0 8px;border:1px solid #d5dbe6;border-radius:9px;font-size:15px;background:#fff;font-family:'Inter',sans-serif;flex-shrink:0;\">\n                <option>🇧🇷 +55<\u002Foption>\n                <option>🇵🇹 +351<\u002Foption>\n                <option>🇺🇸 +1<\u002Foption>\n              <\u002Fsc-raw-select>\n              <input type=\"tel\" required=\"{{ true }}\" placeholder=\"WhatsApp com DDD\" style=\"flex:1;min-width:0;min-height:48px;padding:0 14px;border:1px solid #d5dbe6;border-radius:9px;font-size:16px;font-family:'Inter',sans-serif;background:#fff;\">\n            <\u002Fdiv>\n            <button type=\"submit\" style=\"width:100%;min-height:52px;margin-top:6px;font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;background:#2f7fe8;color:#fff;border:none;border-radius:9px;cursor:pointer;\">QUERO GARANTIR MINHA VAGA →<\u002Fbutton>\n          <\u002Fform>\n          <p style=\"text-align:center;font-size:12.5px;color:#8b93a0;margin:14px 0 0;\">Seus dados estão seguros · Acesso imediato após confirmação<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R$97&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;anchorPrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R$297&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;installments&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:24},&quot;installmentPrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R$10,03&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;guaranteeDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:3,&quot;max&quot;:30}}\">\nconst MODULOS = [\n  { titulo: 'Módulo 1 — O Despertar', aulas: 6, resumo: 'O tamanho real do mercado da REURB, quem o controla hoje, e por que ele ainda está adormecido.' },\n  { titulo: 'Módulo 2 — Do Caos à Previsibilidade', aulas: 5, resumo: 'O método que organiza o fluxo da REURB e transforma um processo instável em algo previsível.' },\n  { titulo: 'Módulo 3 — Da Visão à Oportunidade', aulas: 4, resumo: 'Os caminhos estratégicos pra sair da teoria e começar a atuar nesse mercado essa semana.' },\n];\n\nconst TEMPLATES = [\n  'Ato Comprobatório de Classificação', 'Minuta de Petição — Projeto Municipal', 'Memorial Descritivo e Planta do Imóvel (exemplo)',\n  'Notificação Pessoal Oficial RI', 'Edital de Notificação', 'Decreto AEIS', 'Notificação ao Proprietário Confrontante',\n  'Notificação à União', 'Notificação ao Estado', 'Anuência Expressa do Notificado', 'Aprovação PRF', 'Decisão Instauradora da REURB',\n  'Edital de Demarcação Urbanística', 'Defesa Civil — Declaração Negativa de Risco', 'Minuta de Memorial Descritivo',\n  'Checklist de Análise Documental', 'Planilha de Gestão de Projetos REURB', 'Modelo de Contrato', 'Template de Proposta Comercial',\n  'Cronograma Padrão de Projeto REURB', 'Auto de Demarcação Urbanística (ADU)', 'Auto de Demarcação Urbanística', 'Notificação a Órgãos de Patrimônio Público',\n].map(nome => ({ nome }));\n\nconst TRANSFORMACAO = [\n  { antes: 'Você sabe que existe REURB, mas nunca dimensionou o tamanho real do mercado.', depois: 'Você sabe exatamente quanto está parado — em número, não em achismo (Módulo 1).' },\n  { antes: 'Não entende por que a maioria dos projetos de REURB trava e nunca sai do papel.', depois: 'Entende o método que organiza esse caos e o que sustenta previsibilidade num processo (Módulo 2).' },\n  { antes: 'Não sabe por onde começar a atuar nesse mercado, principalmente sem experiência prévia.', depois: 'Tem os caminhos estratégicos e o próximo passo concreto pra dar essa semana (Módulo 3).' },\n];\n\nconst FAQS = [\n  { q: 'Isso é sobre aprender mais direito imobiliário?', a: 'Não. Você já sabe o direito. Esse guia mostra o tamanho do mercado, por que a maioria dos projetos trava, e o caminho prático pra atuar nele — não é curso de REURB.' },\n  { q: 'Preciso ter experiência prévia com REURB pra aproveitar o guia?', a: 'Não. O Módulo 3 inclusive trata exatamente disso — como começar com estrutura mesmo sem experiência.' },\n  { q: 'Quanto tempo leva pra consumir o conteúdo?', a: 'São 15 aulas curtas, a maioria entre 3 e 5 minutos, organizadas em 3 módulos — dá pra assistir tudo em cerca de uma hora, sem enrolação.' },\n  { q: 'R$8 a R$12 mil por uma única regularização é garantido?', a: 'Não é garantia — é o piso de honorário praticado no mercado com base nas tabelas de referência da OAB para REURB. O guia mostra o tamanho da oportunidade; o resultado depende da atuação de cada advogado.' },\n  { q: 'Isso serve só pra quem já tem escritório grande?', a: 'Não. Quanto menor a estrutura, maior o ganho relativo de entender esse mercado antes de escalar uma equipe grande.' },\n  { q: 'Tem garantia?', a: 'Sim — 7 dias de garantia incondicional. Se não fizer sentido pra você, é só pedir o reembolso, sem burocracia e sem justificativa.' },\n].map((f, i) => ({ ...f, _i: i }));\n\nclass Component extends DCLogic {\n  state = { modalOpen: false, submitted: false, openFaq: 0 };\n\n  componentDidMount() {\n    const els = document.querySelectorAll('#reurb-lp [data-reveal]');\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          entry.target.style.opacity = '1';\n          entry.target.style.transform = 'none';\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });\n    els.forEach(el => io.observe(el));\n  }\n\n  renderVals() {\n    const price = this.props.price ?? 'R$97';\n    const anchorPrice = this.props.anchorPrice ?? 'R$297';\n    const installments = this.props.installments ?? 12;\n    const installmentPrice = this.props.installmentPrice ?? 'R$10,03';\n    const guaranteeDays = this.props.guaranteeDays ?? 7;\n\n    const faqs = FAQS.map(f => ({\n      q: f.q, a: f.a,\n      isOpen: this.state.openFaq === f._i,\n      symbol: this.state.openFaq === f._i ? '−' : '+',\n      toggle: () => this.setState(s => ({ openFaq: s.openFaq === f._i ? null : f._i })),\n    }));\n\n    return {\n      price, anchorPrice, installments, installmentPrice, guaranteeDays,\n      modulos: MODULOS, templates: TEMPLATES, transformacao: TRANSFORMACAO,\n      prints: [{}, {}, {}],\n      faqs,\n      modalOpen: this.state.modalOpen,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      openModal: () => this.setState({ modalOpen: true, submitted: false }),\n      closeModal: () => this.setState({ modalOpen: false }),\n      stopClick: e => e.stopPropagation(),\n      handleSubmit: e => { e.preventDefault(); this.setState({ submitted: true }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
